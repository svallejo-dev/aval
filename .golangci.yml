version: "2"

# Locks derived from the senior-go-idiomatic skill: rules that must hold are
# enforced here, not left as advice in a prompt.
linters:
  default: standard
  enable:
    - wrapcheck       # errors crossing package boundaries carry context
    - errorlint       # errors.Is / errors.As and %w, never == on errors
    - revive          # context.Context as the first parameter, doc comments
    - gocritic        # defer inside loops
    - gosec           # crypto/rand, file permissions, subprocess hygiene
    - copyloopvar     # obsolete `i := i` copies (Go >= 1.22)
    - interfacebloat  # small interfaces
    - bodyclose       # HTTP response bodies are closed
    - depguard        # agent hooks and the envelope stay free of Charm
    - forbidigo       # only the agent hooks may drop --attr-source
  settings:
    errcheck:
      check-type-assertions: true
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    revive:
      enable-default-rules: true
      rules:
        - name: context-as-argument
          arguments:
            - allow-types-before: "*testing.T"
    gocritic:
      enabled-checks:
        - deferInLoop
    interfacebloat:
      max: 10
    depguard:
      # Exactly one named rule: with no rules at all, depguard would allow
      # only the standard library everywhere.
      rules:
        charm-free:
          files:
            - "**/internal/envelope/**"
            - "**/internal/hook/**"
          deny:
            - pkg: charm.land/
              desc: agent hooks and the JSON envelope must not depend on Charm (ADR-0003, < 50 ms)
            - pkg: github.com/charmbracelet/
              desc: agent hooks and the JSON envelope must not depend on Charm (ADR-0003, < 50 ms)
            - pkg: github.com/svallejo-dev/aval/internal/ui
              desc: internal/ui pulls in Charm; hooks and the envelope must not import it, even indirectly (ADR-0003)
            - pkg: github.com/svallejo-dev/aval/internal/cli
              desc: internal/cli pulls in Charm through internal/ui (ADR-0003)
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^git\.WithoutAttrSource$
          pkg: ^github\.com/svallejo-dev/aval/internal/platform/git$
          msg: only internal/hook may read head's .gitattributes; everything else keeps --attr-source (ADR-0005 §1)
  exclusions:
    generated: strict
    presets:
      - std-error-handling
    rules:
      - path: internal/(hook|platform/git)/
        linters:
          - forbidigo

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/svallejo-dev/aval
